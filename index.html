<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Crect x='6' y='9' width='20' height='4' rx='2' fill='%230ca750'/%3E%3Crect x='6' y='16' width='13' height='4' rx='2' fill='%23d28a00'/%3E%3Crect x='6' y='23' width='7' height='4' rx='2' fill='%23dc2b2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Cuentas Claude</title>
<style>
  :root {
    color-scheme: light;
    --plano: #fafafa; --carta: #ffffff; --carta-2: #fafafa;
    --borde: #eaeaea; --borde-2: #f0f0f0;
    --tinta: #171717; --tinta-2: #666666; --tinta-3: #8f8f8f;
    --pista: #eaeaea;
    --verde: #0ca750; --amarillo: #d28a00; --rojo: #dc2b2b; --gris: #a1a1a1;
    --grad-a: #171717; --grad-b: #6e6e6e;
    --hover: #fafafa;
    --cat1: #2a78d6; --cat2: #eb6834; --cat3: #1baf7a; --cat4: #eda100;
    --cat5: #e87ba4; --cat6: #008300; --cat7: #4a3aa7; --cat8: #e34948;
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --plano: #0a0a0a; --carta: #111111; --carta-2: #0a0a0a;
    --borde: #262626; --borde-2: #1f1f1f;
    --tinta: #ededed; --tinta-2: #a1a1a1; --tinta-3: #7a7a7a;
    --pista: #262626;
    --verde: #2fbf68; --amarillo: #f5a623; --rojo: #ff5c5c; --gris: #7a7a7a;
    --grad-a: #ffffff; --grad-b: #8f8f8f;
    --hover: #161616;
    --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500;
    --cat5: #d55181; --cat6: #008300; --cat7: #9085e9; --cat8: #e66767;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark;
      --plano: #0a0a0a; --carta: #111111; --carta-2: #0a0a0a;
      --borde: #262626; --borde-2: #1f1f1f;
      --tinta: #ededed; --tinta-2: #a1a1a1; --tinta-3: #7a7a7a;
      --pista: #262626;
      --verde: #2fbf68; --amarillo: #f5a623; --rojo: #ff5c5c; --gris: #7a7a7a;
      --grad-a: #ffffff; --grad-b: #8f8f8f;
      --hover: #161616;
      --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500;
      --cat5: #d55181; --cat6: #008300; --cat7: #9085e9; --cat8: #e66767;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--plano); color: var(--tinta);
    font: 15px/1.5 Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 18px calc(48px + env(safe-area-inset-bottom));
    max-width: 1220px; margin: 0 auto;
    transition: background .25s ease, color .25s ease;
  }
  .mono { font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* ─ bloque fijo: cabecera + héroe + encabezado de la tabla se quedan arriba al hacer scroll ─ */
  .fijo { position: sticky; top: 0; z-index: 5; background: var(--plano); padding-top: 28px; }

  /* ─ cabecera ─ */
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .vivo { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
          border: 1px solid var(--borde); border-radius: 999px; background: var(--carta);
          font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--tinta-2); }
  .vivo .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--verde); animation: pulso 2.4s ease-in-out infinite; }
  .vivo.caido .punto { background: var(--gris); animation: none; }
  @keyframes pulso { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .reloj { margin-left: auto; font-size: 12px; color: var(--tinta-3); }
  .acciones { display: flex; gap: 8px; }
  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--borde); border-radius: 8px;
    background: var(--carta); color: var(--tinta); font: 500 13px Geist, system-ui, sans-serif;
    cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: var(--hover); border-color: var(--tinta-3); }
  button:active { transform: scale(.97); }
  button.icono { width: 32px; padding: 0; font-size: 15px; line-height: 1; }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

  /* ─ héroe ─ */
  .heroe {
    position: relative; overflow: hidden;
    border: 1px solid var(--borde); border-radius: 12px; background: var(--carta);
    padding: 24px; display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
    animation: entra .45s ease-out both;
  }
  .heroe::before {
    content: ""; position: absolute; inset: -40% -20% auto; height: 130%;
    background: radial-gradient(60% 90% at 30% 0%, var(--glow, transparent), transparent 70%);
    opacity: .14; pointer-events: none;
  }
  .miga { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px;
          letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); }
  .heroe .alias-grande {
    font-size: clamp(34px, 8vw, 44px); font-weight: 650; letter-spacing: -.045em; line-height: 1.1; margin-top: 6px;
    background: linear-gradient(180deg, var(--grad-a), var(--grad-b));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .heroe .sub { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13.5px; color: var(--tinta-2); margin-top: 8px; }
  .heroe .libres { margin-left: auto; display: flex; flex-direction: column; gap: 12px; width: min(300px, 100%); }
  .libres .fila { display: flex; justify-content: space-between; align-items: baseline; font-family: "Geist Mono", ui-monospace, monospace;
                  font-size: 12.5px; color: var(--tinta-3); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .libres .fila b { color: var(--tinta); font-weight: 600; font-size: 16px; letter-spacing: -.01em; }

  /* ─ medidores ─ */
  .pista { height: 5px; border-radius: 2px; background: var(--pista); overflow: hidden; }
  .relleno { display: block; height: 100%; border-radius: 2px; width: 0;
             background: linear-gradient(90deg, color-mix(in srgb, var(--color-cuenta, var(--tinta)) 70%, transparent), var(--color-cuenta, var(--tinta)));
             transition: width .7s cubic-bezier(.2,.8,.2,1); }
  @supports not (background: color-mix(in srgb, red 50%, blue)) { .relleno { background: var(--color-cuenta, var(--tinta)); } }

  /* ─ tabla de cuentas: el encabezado vive en el bloque fijo, las filas en su tarjeta ─ */
  .tabla-cab { margin-top: 16px; border: 1px solid var(--borde); border-bottom: 0; border-radius: 12px 12px 0 0;
               background: var(--carta); overflow: hidden; animation: entra .45s ease-out .07s both; }
  .tabla { border: 1px solid var(--borde); border-top: 0; border-radius: 0 0 12px 12px; background: var(--carta);
           overflow: hidden; animation: entra .45s ease-out .07s both; }
  .thead, .filacta { display: grid; grid-template-columns: 170px 1.25fr .8fr 1.25fr minmax(220px, 310px); gap: 18px; align-items: center; padding: 16px 28px !important; }
  .thead > *, .filacta > * { min-width: 0; }
  .thead { padding: 10px 28px; background: var(--carta-2); border-bottom: 1px solid var(--borde);
           font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .05em;
           text-transform: uppercase; color: var(--tinta-3); }
  .thead span:last-child { text-align: right; }
  .filacta { border-top: 1px solid var(--borde-2); transition: background .15s; animation: entra .4s ease-out both; }
  .filacta:first-of-type { border-top: none; }
  .filacta:hover { background: var(--hover); }
  .filacta.vieja > * { opacity: .55; }
  .cta-id { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cta-id .punto { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--color-cuenta, var(--gris)); }
  .cta-id .alias { font-size: 16.5px; font-weight: 600; letter-spacing: -.02em; }
  .cta-id .etiq { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--tinta-3); white-space: normal; overflow-wrap: anywhere; line-height: 1.5; }
  .etiq .etiq-dato { display: block; color: var(--tinta-3); font-weight: 400; }
  .filacta.ok .etiq { color: var(--verde); }
  .filacta.ojo .etiq { color: var(--amarillo); }
  .medidor .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
                   font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; color: var(--tinta-2);
                   margin-bottom: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .medidor .fila .uso { flex: none; } /* el % jamás se trunca */
  .medidor .pct { font-size: 16px; font-weight: 600; color: var(--tinta); letter-spacing: -.01em; }
  .medidor .vent { display: none; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
                   color: var(--tinta-3); margin-right: 7px; }
  .medidor .fila .t-reset { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* ─ alarmas: agotada parpadea, media carga pulsa suave ─ */
  @keyframes alarma { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  .filacta.alerta, .filacta.alerta:hover { background: color-mix(in srgb, var(--rojo) 8%, transparent); }
  @supports not (background: color-mix(in srgb, red 50%, blue)) { .filacta.alerta, .filacta.alerta:hover { background: rgba(220,43,43,.08); } }
  .filacta.alerta .punto { animation: alarma 1.1s ease-in-out infinite;
                           box-shadow: 0 0 0 4px color-mix(in srgb, var(--rojo) 18%, transparent); }
  .filacta.alerta .etiq { color: var(--rojo); font-weight: 500; }
  .filacta.alerta .relleno { animation: alarma 1.6s ease-in-out infinite; }
  .filacta.ojo .punto { animation: pulso 2.4s ease-in-out infinite; }
  .filacta.aviso .etiq { color: var(--rojo); font-weight: 500; }
  .filacta.aviso .punto { animation: pulso 1.4s ease-in-out infinite; }
  .maqs { text-align: right; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .maq { min-width: 0; }
  .maq .host { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; color: var(--tinta);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .maq .det { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; color: var(--tinta-3); margin-top: 2px;
              overflow-wrap: anywhere; }
  .maq.viejo .host { color: var(--tinta-3); }
  .sindato-txt { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; color: var(--tinta-3); }

  /* ─ sin sesión ─ */
  .sinsesion { border: 1px solid var(--borde); border-radius: 12px; background: var(--carta); margin-top: 16px;
               overflow: hidden; animation: entra .45s ease-out .14s both; }
  .sinsesion .cab { padding: 10px 28px; background: var(--carta-2); border-bottom: 1px solid var(--borde);
                    font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .05em;
                    text-transform: uppercase; color: var(--tinta-3); }
  .sinsesion .maqfila { display: flex; justify-content: space-between; gap: 12px; padding: 12px 28px;
                        border-top: 1px solid var(--borde-2); font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; }
  .sinsesion .maqfila:first-of-type { border-top: none; }
  .sinsesion .maqfila span:last-child { color: var(--tinta-3); text-align: right; }

  /* ─ consumo de tokens ─ */
  .consumo { border: 1px solid var(--borde); border-radius: 12px; background: var(--carta); margin-top: 16px;
             overflow: hidden; animation: entra .45s ease-out .12s both; }
  .consumo .cab { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 28px;
                  background: var(--carta-2); border-bottom: 1px solid var(--borde); }
  .consumo .cab h2 { font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-3);
                     font-family: "Geist Mono", ui-monospace, monospace; }
  .consumo .resumen { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; color: var(--tinta-2); }
  .consumo .resumen b { color: var(--tinta); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; background: var(--carta); }
  .seg button { height: 28px; padding: 0 11px; border: 0; border-radius: 0; background: transparent; font-size: 12.5px; color: var(--tinta-2); }
  .seg button + button { border-left: 1px solid var(--borde); }
  .seg button[aria-pressed="true"] { background: var(--tinta); color: var(--plano); }
  .filtro { height: 28px; padding: 0 28px 0 11px; border: 1px solid var(--borde); border-radius: 8px; background: var(--carta); color: var(--tinta-2);
            font-size: 12.5px; font-family: inherit; max-width: 240px; appearance: none; -webkit-appearance: none; cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, var(--tinta-3) 50%), linear-gradient(135deg, var(--tinta-3) 50%, transparent 50%);
            background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .filtro[data-activo="1"] { background-color: var(--tinta); color: var(--plano); border-color: var(--tinta);
            background-image: linear-gradient(45deg, transparent 50%, var(--plano) 50%), linear-gradient(135deg, var(--plano) 50%, transparent 50%); }
  .leyenda { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-family: "Geist Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--tinta-2); }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 10px; height: 10px; border-radius: 2px; background: var(--f); }
  .consumo .vacio { padding: 22px 28px; font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; color: var(--tinta-3); }

  .serie { padding: 20px 28px 12px; border-bottom: 1px solid var(--borde-2); }
  .serie .cols { display: flex; align-items: flex-end; gap: 6px; height: 120px; border-bottom: 1px solid var(--borde); }
  .serie .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 2px;
                position: relative; cursor: default; border-radius: 4px 4px 0 0; }
  .serie .col:hover, .serie .col:focus-visible { background: var(--hover); outline: none; }
  .serie .col i { display: block; width: 100%; max-width: 24px; margin: 0 auto; background: var(--f); min-height: 2px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .serie .col i:last-child { border-radius: 4px 4px 0 0; }   /* el extremo del dato, redondeado; la base, recta */
  .serie .col .cima { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px; text-align: center; white-space: nowrap;
                      font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--tinta-2); }
  .serie .eje { display: flex; gap: 6px; margin-top: 6px; font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--tinta-3); }
  .serie .eje span { flex: 1; text-align: center; min-width: 0; overflow: hidden; }
  .serie .eje span.hoy { color: var(--tinta); font-weight: 500; }

  .cuadros { display: grid; grid-template-columns: 1fr 1fr; }
  .cuadro { padding: 18px 28px 20px; min-width: 0; }
  .cuadro + .cuadro { border-left: 1px solid var(--borde-2); }
  .cuadro.ancho { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--borde-2); }
  .cuadro h3 { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: .05em;
               text-transform: uppercase; color: var(--tinta-3); margin-bottom: 12px; }
  .barra-fila { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px; gap: 14px; align-items: center; padding: 7px 0; }
  .barra-fila.clic { cursor: pointer; margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; }
  .barra-fila.clic:hover { background: var(--carta-2); }
  .barra-fila.clic[aria-pressed="true"] { background: var(--carta-2); box-shadow: inset 2px 0 0 var(--tinta); }
  .barra-fila .nom { min-width: 0; }
  .barra-fila .nom .t { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .barra-fila .nom .t i { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--f); }
  .barra-fila .nom .d { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--tinta-3); margin-top: 1px;
                        line-height: 1.45; overflow-wrap: anywhere; }
  .barra-fila .apilada { display: flex; gap: 2px; height: 8px; min-width: 0; }
  .barra-fila .apilada i { display: block; height: 100%; background: var(--f); border-radius: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .barra-fila .apilada i:last-child { border-radius: 0 4px 4px 0; }
  .barra-fila .apilada i:hover { filter: brightness(1.15); }
  .barra-fila .val { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; color: var(--tinta); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 260px;
         padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--carta); color: var(--tinta);
         box-shadow: 0 6px 24px rgba(0,0,0,.18); font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; line-height: 1.5; }
  #tip b { display: block; font-size: 14px; font-weight: 600; }
  #tip .l { color: var(--tinta-2); }

  .pie { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 0 2px;
         font-family: "Geist Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--tinta-3); }
  .aviso { color: var(--tinta-3); font-size: 13px; padding: 8px 2px; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  /* ─ móvil: la tabla colapsa a tarjetas ─ */
  @media (max-width: 720px) {
    .fijo { position: static; }
    .tabla-cab { display: none; }
    .tabla { margin-top: 16px; border-top: 1px solid var(--borde); border-radius: 12px; }
    .filacta { grid-template-columns: 1fr; gap: 12px; padding: 16px 18px !important; }
    .maqs { text-align: left; }
    .maq .host, .maq .det { white-space: normal; }
    .medidor .vent { display: inline; }
    .cuadros { grid-template-columns: 1fr; }
    .cuadro, .consumo .cab, .serie, .consumo .vacio { padding-left: 18px; padding-right: 18px; }
    .cuadro + .cuadro { border-left: 0; border-top: 1px solid var(--borde-2); }
    .barra-fila { grid-template-columns: minmax(110px, 150px) 1fr 70px; gap: 10px; }
    .leyenda { margin-left: 0; }
    .heroe { padding: 20px 18px; }
    .heroe .libres { margin-left: 0; }
    .reloj { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="fijo">
<header>
  <h1>Cuentas Claude</h1>
  <span class="vivo" id="vivo"><span class="punto"></span><span id="vivo-txt">conectando…</span></span>
  <span class="reloj mono" id="reloj"></span>
  <span class="acciones">
    <button class="icono" id="tema" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    <button onclick="cargar()">Refrescar</button>
  </span>
</header>
<div id="cabecera"></div>
</div>
<div id="app"><div class="aviso">Cargando…</div></div>
<div id="tip" role="tooltip"></div>
<div class="pie"><span id="actualizado">—</span><span>se refresca cada 2 min · <span id="version"></span></span></div>
<noscript><div class="aviso">Este tablero necesita JavaScript.</div></noscript>
<script src="agregacion.js"></script>
<script>
const GIST_ID = "5b820c7ae6023afbfb862b25b5e4c177"; // mismo valor que reportar.py
const VERSION = "v20"; // subir en cada cambio de UI — dispara la auto-recarga de pestañas abiertas
// ?estado=<url> permite previsualizar el tablero con otro estado.json (p. ej. uno local) sin tocar el gist.
const ESTADO_URL = new URLSearchParams(location.search).get("estado");
/* la familia del modelo va en orden fijo sobre la misma paleta categórica: Fable siempre naranja */
const COLOR_FAMILIA = { Opus: "var(--cat1)", Fable: "var(--cat2)", Sonnet: "var(--cat3)", Haiku: "var(--cat4)", Otro: "var(--cat5)" };
const VENTANAS = [[1, "Hoy"], [7, "7 días"], [14, "14 días"]];
let ventanaDias = Number(localStorage.getItem("consumo_dias")) || 7;
// Filtro del consumo: { cuenta } o { maquina }, o null para todo. Se guarda como "c:Alias" / "m:Clave".
let filtroActivo = filtroDesdeTexto(localStorage.getItem("consumo_filtro"));
let ultimoEstado = null;
let ultimoFetchOk = null;
let primeraPintura = true;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const ETIQUETA = { verde: "libre", amarillo: "a media carga", rojo: "agotada" };
const COLOR = { verde: "var(--verde)", amarillo: "var(--amarillo)", rojo: "var(--rojo)" };

/* identidad: color único y estable por cuenta (hash del alias → slot de la paleta) */
const CATS = 8;
function hashAlias(a) {
  let h = 5381;
  for (const ch of String(a)) h = ((h * 33) ^ ch.codePointAt(0)) >>> 0;
  return h;
}
function mapaColores(aliases) {
  const usado = {}, mapa = {};
  for (const a of [...aliases].sort()) {
    let s = hashAlias(a) % CATS;
    while (usado[s]) s = (s + 1) % CATS;
    usado[s] = 1;
    mapa[a] = `var(--cat${s + 1})`;
  }
  return mapa;
}

/* ─ tema: sistema por defecto, toggle manual persistido ─ */
(function () {
  const guardado = localStorage.getItem("tema");
  if (guardado === "dark" || guardado === "light") document.documentElement.dataset.theme = guardado;
  document.getElementById("tema").addEventListener("click", () => {
    const raiz = document.documentElement;
    const oscuroAhora = raiz.dataset.theme === "dark" ||
      (!raiz.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    raiz.dataset.theme = oscuroAhora ? "light" : "dark";
    localStorage.setItem("tema", raiz.dataset.theme);
  });
})();

function cuentaRegresiva(iso, ahoraMs, viejo) {
  if (!iso) return "";
  const s = (Date.parse(iso) - ahoraMs) / 1000;
  if (!isFinite(s)) return "";
  if (s <= 0) return viejo ? "ventana reseteada" : "reseteando…";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = Math.floor(s % 60);
  if (h >= 48) { const d = Math.floor(h / 24); return `resetea en ${d} d ${h % 24} h`; }
  return h ? `resetea en ${h} h ${m} m` : `resetea en ${m} m ${String(seg).padStart(2, "0")} s`;
}

function anchoPct(pct) {
  const n = Number(pct);
  return isFinite(n) ? Math.min(Math.max(n, 0), 100) : 0;
}

function barra(pct) {
  const w = anchoPct(pct);
  return `<div class="pista"><i class="relleno" data-w="${w}" style="width:${primeraPintura ? 0 : w}%"></i></div>`;
}

function medidor(nombre, ventana, viejo, conReset = true) {
  const critico = Number(ventana.pct) > 80;
  return `<div class="medidor"${critico ? ' style="--color-cuenta:var(--rojo)"' : ""}>
    <div class="fila">
      <span class="uso"><span class="vent">${nombre}</span><b class="pct">${esc(String(ventana.pct))}%</b></span>
      ${conReset ? `<span class="t-reset" data-reset="${esc(String(ventana.resetea || ""))}" data-viejo="${viejo ? 1 : 0}"></span>` : ""}
    </div>
    ${barra(ventana.pct)}
  </div>`;
}

// Sin cuenta regresiva: el límite de Fable resetea con la ventana semanal, que ya está al lado.
function medidorModelo(c, nombre, vieja) {
  const lim = c.cupo && c.cupo.modelos && c.cupo.modelos[nombre];
  return lim ? medidor(nombre, lim, vieja, false) : `<div class="sindato-txt">${c.cupo ? "—" : ""}</div>`;
}

function maqHtml(m) {
  const act = m.ultima_actividad;
  const det = act
    ? `<span class="t-hace" data-ts="${esc(String(act.hace))}"></span> · ${esc(act.proyecto || "?")}`
    : "sin actividad";
  const extra = m.fresco ? "" : ` · sin reporte <span class="t-hace" data-ts="${esc(String(m.reportado))}"></span>`;
  return `<div class="maq ${m.fresco ? "" : "viejo"}">
    <div class="host" title="${esc(m.clave)}">${esc(m.clave)}</div><div class="det">${det}${extra}</div>
  </div>`;
}

/* ─ consumo de tokens ─ */
function hoyLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function tip(valor, etiqueta) {
  return `data-tip="${esc(valor)}\n${esc(etiqueta)}"`;
}

function apilada(porFamilia, total, etiqueta) {
  const segs = FAMILIAS.filter(f => porFamilia[f]).map(f =>
    `<i style="--f:${COLOR_FAMILIA[f]};width:${(porFamilia[f] / total * 100).toFixed(2)}%" ${tip(humanizarTokens(porFamilia[f]), `${f} · ${etiqueta}`)}></i>`);
  return `<div class="apilada">${segs.join("")}</div>`;
}

// `clic` (opcional): valor de filtro ("c:Alias" / "m:Clave"); la fila se vuelve un botón que lo aplica o lo quita.
function filaBarra(nombre, detalle, fila, max, colorFamilia, clic) {
  const ancho = max ? (fila.total / max * 100).toFixed(2) : 0;
  const boton = clic
    ? ` role="button" tabindex="0" aria-pressed="${clic === filtroATexto(filtroActivo)}" data-filtro="${esc(clic)}" onclick="filtrar(this.dataset.filtro)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filtrar(this.dataset.filtro)}"`
    : "";
  const swatch = colorFamilia ? `<i style="--f:${COLOR_FAMILIA[colorFamilia]}"></i>` : "";
  const barra = colorFamilia
    ? `<div class="apilada"><i style="--f:${COLOR_FAMILIA[colorFamilia]};width:${ancho}%" ${tip(humanizarTokens(fila.total), nombre)}></i></div>`
    : `<div style="width:${ancho}%;min-width:0">${apilada(fila.porFamilia, fila.total, nombre)}</div>`;
  return `<div class="barra-fila${clic ? " clic" : ""}"${boton}>
    <div class="nom"><div class="t" title="${esc(nombre)}">${swatch}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(nombre)}</span></div><div class="d" title="${esc(detalle)}">${esc(detalle)}</div></div>
    ${barra}
    <div class="val">${esc(humanizarTokens(fila.total))}</div>
  </div>`;
}

function desglose(f) {
  return `salida ${humanizarTokens(f.salida)} · entrada ${humanizarTokens(f.entrada)} · caché ${humanizarTokens(f.cache)} · ${f.msgs.toLocaleString("es-CO")} msgs`;
}

function filtroDesdeTexto(t) {
  if (!t) return null;
  const valor = t.slice(2);
  if (t.startsWith("c:") && valor) return { cuenta: valor };
  if (t.startsWith("m:") && valor) return { maquina: valor };
  return null;
}

function filtroATexto(f) {
  return f ? (f.maquina ? `m:${f.maquina}` : `c:${f.cuenta}`) : "";
}

// El selector ofrece solo lo que tiene consumo en la ventana; un filtro guardado que ya no
// aparece (compu apagado, cuenta sin uso) se descarta en vez de dejar el tablero vacío.
function selectorFiltro(todo) {
  const cuentas = todo.porCuenta.map(x => x.alias), maquinas = todo.porMaquina.map(m => m.clave);
  if (filtroActivo && !(filtroActivo.cuenta ? cuentas.includes(filtroActivo.cuenta) : maquinas.includes(filtroActivo.maquina))) {
    filtroActivo = null;
    localStorage.removeItem("consumo_filtro");
  }
  const actual = filtroATexto(filtroActivo);
  const opcion = (v, t) => `<option value="${esc(v)}" ${v === actual ? "selected" : ""}>${esc(t)}</option>`;
  const grupo = (titulo, items) => items.length ? `<optgroup label="${titulo}">${items.join("")}</optgroup>` : "";
  return `<select class="filtro" aria-label="Filtrar por cuenta o máquina" data-activo="${actual ? 1 : 0}" onchange="filtrar(this.value)">
    ${opcion("", "Todas")}
    ${grupo("Cuentas", cuentas.map(a => opcion(`c:${a}`, a)))}
    ${grupo("Máquinas", maquinas.map(k => opcion(`m:${k}`, k)))}
  </select>`;
}

function filtrar(texto) {
  const nuevo = filtroDesdeTexto(texto);
  // Clic sobre la fila ya activa: quita el filtro.
  filtroActivo = nuevo && filtroATexto(nuevo) === filtroATexto(filtroActivo) ? null : nuevo;
  if (filtroActivo) localStorage.setItem("consumo_filtro", filtroATexto(filtroActivo));
  else localStorage.removeItem("consumo_filtro");
  if (ultimoEstado) pintar(ultimoEstado);
}

function consumoHtml(estado) {
  const hoy = hoyLocal();
  const todo = consumo(estado, hoy, ventanaDias);
  const selector = selectorFiltro(todo);
  const c = filtroActivo ? consumo(estado, hoy, ventanaDias, filtroActivo) : todo;
  const seg = `<div class="seg" role="group" aria-label="Ventana">${VENTANAS.map(([d, t]) =>
    `<button type="button" aria-pressed="${d === ventanaDias}" onclick="ventana(${d})">${t}</button>`).join("")}</div>`;
  const leyenda = c.porFamilia.length ? `<div class="leyenda">${c.porFamilia.map(f =>
    `<span><i style="--f:${COLOR_FAMILIA[f.familia]}"></i>${esc(f.familia)}</span>`).join("")}</div>` : "";
  const resumen = c.total
    ? `<span class="resumen"><b>${esc(humanizarTokens(c.total))}</b> tokens · <b>${esc(humanizarTokens(c.salida))}</b> de salida · ${c.msgs.toLocaleString("es-CO")} msgs · ${c.porMaquina.length} ${c.porMaquina.length === 1 ? "máquina" : "máquinas"}</span>`
    : "";
  let html = `<section class="consumo"><div class="cab"><h2>Consumo de tokens</h2>${seg}${selector}${resumen}${leyenda}</div>`;
  if (!c.total) {
    html += `<div class="vacio">Sin datos de consumo en esta ventana. Cada compu los publica al reportar (hace falta el reportero actualizado).</div></section>`;
    return html;
  }

  /* serie por día: columnas apiladas por familia; solo el máximo lleva su valor encima */
  if (c.porDia.length > 1) {
    const max = Math.max(...c.porDia.map(d => d.total));
    const iMax = c.porDia.findIndex(d => d.total === max);
    html += `<div class="serie"><div class="cols">${c.porDia.map((d, i) => {
      const fecha = new Date(d.dia + "T12:00:00");
      const etiqueta = fecha.toLocaleDateString("es-CO", { weekday: "short", day: "numeric", month: "short" });
      const segs = FAMILIAS.filter(f => d.porFamilia[f]).map(f =>
        `<i style="--f:${COLOR_FAMILIA[f]};height:${(d.porFamilia[f] / max * 100).toFixed(2)}%"></i>`).join("");
      const cima = (i === iMax || d.dia === hoy) && d.total ? `<span class="cima">${esc(humanizarTokens(d.total))}</span>` : "";
      const detalle = FAMILIAS.filter(f => d.porFamilia[f]).map(f => `${f} ${humanizarTokens(d.porFamilia[f])}`).join(" · ") || "sin uso";
      return `<div class="col" tabindex="0" ${tip(humanizarTokens(d.total), `${etiqueta} · ${detalle}`)}>${cima}${segs}</div>`;
    }).join("")}</div>
    <div class="eje">${c.porDia.map(d => `<span class="${d.dia === hoy ? "hoy" : ""}">${new Date(d.dia + "T12:00:00").getDate()}</span>`).join("")}</div></div>`;
  }

  // Por máquina es el dato de origen (cada compu publica el suyo); por cuenta es derivado:
  // suma las máquinas que hoy están en esa cuenta.
  const maxModelo = c.porModelo[0].total, maxCuenta = c.porCuenta[0].total, maxMaq = c.porMaquina[0].total;
  html += `<div class="cuadros">
    <div class="cuadro"><h3>Por modelo</h3>${c.porModelo.map(m => filaBarra(m.nombre, desglose(m), m, maxModelo, m.familia)).join("")}</div>
    <div class="cuadro"><h3>Por cuenta</h3>${c.porCuenta.map(x => filaBarra(x.alias, desglose(x), x, maxCuenta, null, `c:${x.alias}`)).join("")}</div>
    <div class="cuadro ancho"><h3>Por máquina</h3>${c.porMaquina.map(m => filaBarra(m.clave, `${m.cuenta || SIN_SESION} · ${desglose(m)}`, m, maxMaq, null, `m:${m.clave}`)).join("")}</div>
  </div></section>`;
  return html;
}

function ventana(dias) {
  ventanaDias = dias;
  localStorage.setItem("consumo_dias", String(dias));
  if (ultimoEstado) pintar(ultimoEstado);
}

/* tooltip único: el valor manda, la etiqueta acompaña; el texto entra como texto, nunca como HTML */
(function () {
  const el = document.getElementById("tip");
  function mostrar(objetivo, x, y) {
    const [valor, ...resto] = objetivo.dataset.tip.split("\n");
    el.replaceChildren(Object.assign(document.createElement("b"), { textContent: valor }),
                       Object.assign(document.createElement("span"), { className: "l", textContent: resto.join(" ") }));
    el.style.display = "block";
    const r = el.getBoundingClientRect();
    el.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
    el.style.top = (y + 18 + r.height > innerHeight ? y - r.height - 10 : y + 18) + "px";
  }
  document.addEventListener("pointermove", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (t) mostrar(t, e.clientX, e.clientY); else el.style.display = "none";
  });
  document.addEventListener("focusin", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (t) { const r = t.getBoundingClientRect(); mostrar(t, r.left + r.width / 2, r.bottom); }
  });
  document.addEventListener("focusout", () => { el.style.display = "none"; });
  document.addEventListener("scroll", () => { el.style.display = "none"; }, { passive: true });
})();

function pintar(estado) {
  const ahoraMs = Date.now();
  const agg = agregar(estado, new Date(ahoraMs).toISOString());
  const colores = mapaColores(agg.cuentas.map(c => c.alias));
  let cabecera = "", html = "";

  /* héroe */
  const r = agg.recomendada;
  if (r === null) {
    cabecera += `<div class="heroe"><div><div class="miga">→ Usa</div>
      <div class="alias-grande">Sin dato de cupo</div>
      <div class="sub">ninguna cuenta tiene medición todavía</div></div></div>`;
  } else {
    const c = agg.cuentas.find(x => x.alias === r.alias);
    const glow = c && c.semaforo ? COLOR[c.semaforo] : "transparent";
    const nota = r.dato_de_hace_s > FRESCO_S ? ` · con dato de ${humanizar(r.dato_de_hace_s)}` : "";
    const sub = c && c.cupo
      ? `<span class="t-reset" data-reset="${esc(String(c.cupo.cinco_horas.resetea || ""))}" data-viejo="${c.fresco ? 0 : 1}"></span>${nota}`
      : "";
    const libres = c && c.cupo ? `<div class="libres">
        <div><div class="fila"><span>5 h libre</span><b>${esc(String(100 - c.cupo.cinco_horas.pct))}%</b></div>${barra(100 - c.cupo.cinco_horas.pct)}</div>
        ${c.cupo.modelos && c.cupo.modelos.Fable ? `<div><div class="fila"><span>Fable libre</span><b>${esc(String(100 - c.cupo.modelos.Fable.pct))}%</b></div>${barra(100 - c.cupo.modelos.Fable.pct)}</div>` : ""}
        <div><div class="fila"><span>semana libre</span><b>${esc(String(100 - c.cupo.semanal.pct))}%</b></div>${barra(100 - c.cupo.semanal.pct)}</div>
      </div>` : "";
    cabecera += `<div class="heroe" style="--glow:${glow};--color-cuenta:${colores[r.alias] || "var(--tinta)"}"><div style="min-width:0">
      <div class="miga">→ Usa</div>
      <div class="alias-grande">${esc(r.alias)}</div>
      <div class="sub">${sub}</div></div>${libres}</div>`;
  }

  /* tabla de cuentas */
  cabecera += `<div class="tabla-cab"><div class="thead"><span>Cuenta</span><span>Sesión · 5 h</span><span>Fable · semanal</span><span>Semanal</span><span>Máquinas</span></div></div>`;
  html += `<div class="tabla">`;
  agg.cuentas.forEach((c, i) => {
    const vieja = c.cupo && !c.fresco;
    const agotada = c.semaforo === "rojo" && c.score >= 99;
    const nombreEstado = c.cupo ? (agotada ? "agotada" : (c.semaforo === "rojo" ? "por agotarse" : ETIQUETA[c.semaforo])) : null;
    const etiq = c.cupo
      ? `${nombreEstado}${vieja ? `<span class="etiq-dato">dato de <span class="t-hace" data-ts="${esc(String(c.medido))}"></span></span>` : ""}`
      : "cupo desconocido";
    const maqs = c.maquinas.length ? c.maquinas.map(maqHtml).join("") : `<div class="maq"><div class="det">—</div></div>`;
    const alarma = agotada ? "alerta" : (c.semaforo === "rojo" ? "aviso" : (c.semaforo === "amarillo" ? "ojo" : (c.semaforo === "verde" ? "ok" : "")));
    html += `<div class="filacta ${vieja ? "vieja" : ""} ${alarma}" style="--color-cuenta:${colores[c.alias]};animation-delay:${.1 + i * .06}s">
      <div class="cta-id"><span class="punto"></span><span style="min-width:0">
        <span class="alias">${esc(c.alias)}</span><br><span class="etiq">${etiq}</span></span></div>
      ${c.cupo ? medidor("sesión", c.cupo.cinco_horas, vieja) : `<div class="sindato-txt">sin medición — se llena cuando un compu entre a esta cuenta</div>`}
      ${medidorModelo(c, "Fable", vieja)}
      ${c.cupo ? medidor("semanal", c.cupo.semanal, vieja) : `<div class="sindato-txt"></div>`}
      <div class="maqs">${maqs}</div>
    </div>`;
  });
  html += `</div>`;

  html += consumoHtml(estado);

  /* sin sesión */
  if (agg.sin_sesion.length) {
    html += `<div class="sinsesion"><div class="cab">Sin sesión</div>
      ${agg.sin_sesion.map(m => {
        const act = m.ultima_actividad;
        const det = act
          ? `<span class="t-hace" data-ts="${esc(String(act.hace))}"></span> · ${esc(act.proyecto || "?")}`
          : "sin actividad";
        const extra = m.fresco ? "" : ` · sin reporte <span class="t-hace" data-ts="${esc(String(m.reportado))}"></span>`;
        return `<div class="maqfila"><span>${esc(m.clave)}</span><span>${det}${extra}</span></div>`;
      }).join("")}</div>`;
  }

  const agotadas = agg.cuentas.filter(c => c.semaforo === "rojo").length;
  document.title = (agotadas ? "🔴 " : "") + "Cuentas Claude";

  document.getElementById("cabecera").innerHTML = cabecera;
  document.getElementById("app").innerHTML = html;
  if (primeraPintura) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll(".relleno[data-w]").forEach(el => { el.style.width = el.dataset.w + "%"; });
    }));
    primeraPintura = false;
  }
  tictac();
}

/* la firma: el tablero late — relojes vivos cada segundo, sin re-fetch */
function tictac() {
  const ahoraMs = Date.now();
  document.querySelectorAll(".t-hace").forEach(el => {
    const t = Date.parse(el.dataset.ts);
    if (isFinite(t)) el.textContent = humanizar((ahoraMs - t) / 1000);
  });
  document.querySelectorAll(".t-reset").forEach(el => {
    el.textContent = cuentaRegresiva(el.dataset.reset, ahoraMs, el.dataset.viejo === "1");
  });
  document.getElementById("reloj").textContent =
    new Date(ahoraMs).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  if (ultimoFetchOk) {
    document.getElementById("actualizado").textContent =
      "Actualizado " + ultimoFetchOk.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  }
}
setInterval(tictac, 1000);

async function traerEstado() {
  if (ESTADO_URL) {
    const resp = await fetch(ESTADO_URL, { cache: "no-store" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  }
  // Raw del CDN: sin límite de API (el límite anónimo de api.github.com es 60/h POR IP,
  // y una oficina entera lo comparte). El ?t= esquiva el caché de 5 min del CDN.
  try {
    const resp = await fetch(`https://gist.githubusercontent.com/santiago-prolibu/${GIST_ID}/raw/estado.json?t=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.json();
  } catch (e) {
    const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return JSON.parse((await resp.json()).files["estado.json"].content);
  }
}

async function cargar() {
  const vivo = document.getElementById("vivo");
  try {
    ultimoEstado = await traerEstado();
    ultimoFetchOk = new Date();
    vivo.classList.remove("caido");
    document.getElementById("vivo-txt").textContent = "en vivo";
    pintar(ultimoEstado);
  } catch (e) {
    vivo.classList.add("caido");
    document.getElementById("vivo-txt").textContent = "sin conexión";
    if (ultimoEstado) { pintar(ultimoEstado); }
    else { document.getElementById("app").innerHTML = `<div class="aviso">No se pudo cargar (${esc(e.message)}). Reintento en 2 min.</div>`; }
  }
}

/* auto-actualización: si hay versión nueva publicada, la pestaña se recarga sola */
document.getElementById("version").textContent = VERSION;
async function buscarVersionNueva() {
  try {
    const resp = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) return;
    const m = (await resp.text()).match(/const VERSION = "([^"]+)"/);
    if (m && m[1] !== VERSION) location.reload();
  } catch (e) { /* sin red: se intenta en el próximo ciclo */ }
}
setInterval(buscarVersionNueva, 180000);

cargar();
setInterval(cargar, 120000);
