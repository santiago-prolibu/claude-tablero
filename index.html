<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Crect x='6' y='9' width='20' height='4' rx='2' fill='%230ca30c'/%3E%3Crect x='6' y='16' width='13' height='4' rx='2' fill='%23fab219'/%3E%3Crect x='6' y='23' width='7' height='4' rx='2' fill='%23d03b3b'/%3E%3C/svg%3E">
<title>Cuentas Claude</title>
<style>
  :root {
    color-scheme: light;
    --plano: #f9f9f7;          /* página */
    --superficie: #fcfcfb;     /* tarjetas */
    --tinta: #0b0b0b;
    --tinta-2: #52514e;
    --tinta-3: #898781;
    --pista: #e1e0d9;          /* riel de los medidores */
    --borde: rgba(11,11,11,.10);
    --bien: #0ca30c;           /* semáforo: libre */
    --ojo: #fab219;            /* semáforo: a media carga */
    --tope: #d03b3b;           /* semáforo: agotada */
    --sombra: 0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --plano: #0d0d0d;
      --superficie: #1a1a19;
      --tinta: #ffffff;
      --tinta-2: #c3c2b7;
      --tinta-3: #898781;
      --pista: #2c2c2a;
      --borde: rgba(255,255,255,.10);
      --sombra: none;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--plano); color: var(--tinta);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  /* cabecera */
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  header h1 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }
  .vivo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-3); }
  .vivo .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--bien); animation: latido 2.4s ease-in-out infinite; }
  .vivo.caido .punto { background: var(--tinta-3); animation: none; }
  @keyframes latido { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* héroe: la respuesta */
  .heroe {
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px;
    box-shadow: var(--sombra); padding: 18px 18px 16px; margin-bottom: 14px;
    animation: entra .4s ease-out both;
  }
  .heroe .miga { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); margin-bottom: 2px; }
  .heroe .alias { font-size: 40px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }
  .heroe .datoviejo { font-size: 13px; color: var(--tinta-2); margin-top: 2px; }
  .heroe .cifras { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--tinta-2); flex-wrap: wrap; }
  .heroe .cifras b { color: var(--tinta); font-weight: 650; }
  .heroe.sindato .alias { font-size: 22px; color: var(--tinta-2); font-weight: 600; }

  /* tarjetas de cuenta */
  .tarjeta {
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px;
    box-shadow: var(--sombra); padding: 14px 16px; margin-bottom: 10px;
    animation: entra .4s ease-out both;
  }
  .tarjeta:nth-of-type(2) { animation-delay: .05s } .tarjeta:nth-of-type(3) { animation-delay: .1s }
  .tarjeta:nth-of-type(4) { animation-delay: .15s } .tarjeta:nth-of-type(5) { animation-delay: .2s }
  @keyframes entra { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .tarjeta.vieja { opacity: .6; }
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cabecera .alias { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-2);
          border: 1px solid var(--borde); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .chip .punto { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip.verde .punto { background: var(--bien) } .chip.amarillo .punto { background: var(--ojo) }
  .chip.rojo .punto { background: var(--tope) } .chip.gris .punto { background: var(--tinta-3) }

  /* medidores */
  .medidor { margin: 9px 0 2px; }
  .medidor .fila { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 4px; }
  .medidor .nombre { color: var(--tinta-2); }
  .medidor .pct { font-size: 13px; color: var(--tinta); }
  .medidor .reset { font-size: 12px; color: var(--tinta-3); }
  .pista { background: var(--pista); border-radius: 4px; height: 6px; overflow: hidden; }
  .relleno { height: 100%; border-radius: 4px; width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .verde .relleno { background: var(--bien) } .amarillo .relleno { background: var(--ojo) } .rojo .relleno { background: var(--tope) }
  .desconocido { font-size: 13px; color: var(--tinta-3); padding: 6px 0 2px; }

  /* compus */
  .compus { margin-top: 10px; border-top: 1px solid var(--borde); padding-top: 8px; }
  .compu { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 3px 0; font-size: 13px; }
  .compu .clave { font-size: 12.5px; }
  .compu .detalle { color: var(--tinta-2); text-align: right; }
  .compu.viejo, .compu.viejo .detalle { color: var(--tinta-3); }

  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); margin: 18px 0 8px 4px; font-weight: 600; }

  /* pie */
  .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--tinta-3); font-size: 12.5px; }
  button {
    background: var(--superficie); border: 1px solid var(--borde); color: var(--tinta);
    border-radius: 999px; padding: 7px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
  .aviso { color: var(--tinta-3); font-size: 13px; padding: 8px 4px; }
  @media (prefers-reduced-motion: reduce) {
    .heroe, .tarjeta { animation: none } .relleno { transition: none } .vivo .punto { animation: none }
  }
</style>
</head>
<body>
<header>
  <h1>Cuentas Claude</h1>
  <span class="vivo" id="vivo"><span class="punto"></span><span id="vivo-txt">conectando…</span></span>
</header>
<div id="app"><div class="aviso">Cargando…</div></div>
<div class="pie"><span id="actualizado"></span><button onclick="cargar()">Refrescar</button></div>
<noscript><div class="aviso">Este tablero necesita JavaScript.</div></noscript>
<script src="agregacion.js"></script>
<script>
const GIST_ID = "5b820c7ae6023afbfb862b25b5e4c177"; // mismo valor que reportar.py
let ultimoEstado = null;
let ultimoFetchOk = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const ETIQUETA = { verde: "libre", amarillo: "a media carga", rojo: "agotada" };

function cuentaRegresiva(iso, ahoraMs, viejo) {
  if (!iso) return "";
  const s = (Date.parse(iso) - ahoraMs) / 1000;
  if (s <= 0) return viejo ? "ventana reseteada" : "reseteando…";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = Math.floor(s % 60);
  return h ? `resetea en ${h} h ${m} m` : `resetea en ${m} m ${String(seg).padStart(2, "0")} s`;
}

function medidor(nombre, ventana, clase, viejo) {
  const pct = Number(ventana.pct);
  const ancho = isFinite(pct) ? Math.min(Math.max(pct, 0), 100) : 0;
  return `<div class="medidor ${clase}">
    <div class="fila">
      <span class="nombre">${nombre} · <span class="pct mono">${esc(String(ventana.pct))}%</span> usado</span>
      <span class="reset mono t-reset" data-reset="${esc(String(ventana.resetea || ""))}" data-viejo="${viejo ? 1 : 0}"></span>
    </div>
    <div class="pista"><div class="relleno" style="width:${ancho}%"></div></div>
  </div>`;
}

function compuHtml(m, ahoraMs) {
  const act = m.ultima_actividad;
  const det = act
    ? `<span class="t-hace" data-ts="${esc(String(act.hace))}"></span> · ${esc(act.proyecto || "?")}`
    : "sin actividad";
  const extra = m.fresco ? "" : ` · sin reporte <span class="t-hace" data-ts="${esc(String(m.reportado))}"></span>`;
  return `<div class="compu ${m.fresco ? "" : "viejo"}">
    <span class="clave mono">${esc(m.clave)}</span><span class="detalle">${det}${extra}</span>
  </div>`;
}

function pintar(estado) {
  const ahoraMs = Date.now();
  const agg = agregar(estado, new Date(ahoraMs).toISOString());
  let html = "";

  const r = agg.recomendada;
  if (r === null) {
    html += `<div class="heroe sindato"><div class="miga">→ Usa</div><div class="alias">Sin dato de cupo</div></div>`;
  } else {
    const c = agg.cuentas.find(x => x.alias === r.alias);
    const viejaNota = r.dato_de_hace_s > FRESCO_S
      ? `<div class="datoviejo">con dato de ${humanizar(r.dato_de_hace_s)}</div>` : "";
    const cifras = c && c.cupo ? `<div class="cifras">
        <span>5 h: <b class="mono">${esc(String(100 - c.cupo.cinco_horas.pct))}%</b> libre</span>
        <span>semana: <b class="mono">${esc(String(100 - c.cupo.semanal.pct))}%</b> libre</span>
        <span class="mono t-reset" data-reset="${esc(String(c.cupo.cinco_horas.resetea || ""))}" data-viejo="${c.fresco ? 0 : 1}"></span>
      </div>` : "";
    html += `<div class="heroe"><div class="miga">→ Usa</div><div class="alias">${esc(r.alias)}</div>${viejaNota}${cifras}</div>`;
  }

  for (const c of agg.cuentas) {
    const vieja = c.cupo && !c.fresco;
    const chip = c.cupo
      ? `<span class="chip ${c.semaforo}"><span class="punto"></span>${ETIQUETA[c.semaforo]}${vieja ? ` · dato de <span class="t-hace" data-ts="${esc(String(c.medido))}"></span>` : ""}</span>`
      : `<span class="chip gris"><span class="punto"></span>cupo desconocido</span>`;
    html += `<div class="tarjeta ${vieja ? "vieja" : ""}">
      <div class="cabecera"><span class="alias">${esc(c.alias)}</span>${chip}</div>`;
    if (c.cupo) {
      html += medidor("5 h", c.cupo.cinco_horas, c.semaforo, vieja);
      html += medidor("Semana", c.cupo.semanal, c.semaforo, vieja);
    } else {
      html += `<div class="desconocido">Sin medición todavía — se llena cuando un compu entre a esta cuenta.</div>`;
    }
    if (c.maquinas.length) {
      html += `<div class="compus">${c.maquinas.map(m => compuHtml(m, ahoraMs)).join("")}</div>`;
    }
    html += `</div>`;
  }

  if (agg.sin_sesion.length) {
    html += `<h2>Sin sesión</h2><div class="tarjeta"><div class="compus" style="border-top:none;padding-top:0;margin-top:0">
      ${agg.sin_sesion.map(m => compuHtml(m, ahoraMs)).join("")}</div></div>`;
  }

  document.getElementById("app").innerHTML = html;
  tictac();
}

/* la firma: el tablero late — relojes vivos cada segundo, sin re-fetch */
function tictac() {
  const ahoraMs = Date.now();
  document.querySelectorAll(".t-hace").forEach(el => {
    const t = Date.parse(el.dataset.ts);
    if (isFinite(t)) el.textContent = humanizar((ahoraMs - t) / 1000);
  });
  document.querySelectorAll(".t-reset").forEach(el => {
    el.textContent = cuentaRegresiva(el.dataset.reset, ahoraMs, el.dataset.viejo === "1");
  });
  if (ultimoFetchOk) {
    document.getElementById("actualizado").textContent =
      "Actualizado " + ultimoFetchOk.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }) + " · se refresca cada 2 min";
  }
}
setInterval(tictac, 1000);

async function cargar() {
  const vivo = document.getElementById("vivo");
  try {
    const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    ultimoEstado = JSON.parse((await resp.json()).files["estado.json"].content);
    ultimoFetchOk = new Date();
    vivo.classList.remove("caido");
    document.getElementById("vivo-txt").textContent = "en vivo";
    pintar(ultimoEstado);
  } catch (e) {
    vivo.classList.add("caido");
    document.getElementById("vivo-txt").textContent = "sin conexión";
    if (ultimoEstado) { pintar(ultimoEstado); }
    else { document.getElementById("app").innerHTML = `<div class="aviso">No se pudo cargar (${esc(e.message)}). Reintento en 2 min.</div>`; }
  }
}

cargar();
setInterval(cargar, 120000);
</script>
</body>
</html>
